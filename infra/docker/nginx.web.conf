# nginx para apps/web (SPA estática, React + Vite) — Atiende Licitaciones.
#
# Fuente única de verdad de las cabeceras de seguridad/CSP:
# apps/web/src/lib/security/csp.ts (usado también por vite.config.ts para
# el <meta http-equiv="Content-Security-Policy"> y las cabeceras de
# `vite preview`). Este archivo REPLICA las mismas directivas a propósito
# (ver apps/web/README.md § "Cabeceras de seguridad en producción": el
# operador de producción debe fijar las MISMAS cabeceras) — si
# csp.ts cambia, esta configuración debe actualizarse a mano en la misma
# ronda (no hay generación automática entre ambos, es una limitación
# documentada, no un descuido).
#
# Sirve en el puerto 8080 (no root) — ver apps/web/Dockerfile: la imagen
# corre como usuario "nginx" sin privilegios, por lo que no puede
# escuchar en el puerto 80 (<1024).

server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Cabeceras de seguridad (replican SECURITY_HEADERS + CONTENT_SECURITY_POLICY
    # de apps/web/src/lib/security/csp.ts).
    # ------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ------------------------------------------------------------------
    # Compresión gzip para el bundle estático.
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # Caché de assets con hash en el nombre (Vite: /assets/*.<hash>.js|css):
    # inmutables de verdad -- un cambio de contenido siempre produce un
    # nombre de archivo distinto, así que 1 año + immutable es seguro.
    # ------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html y cualquier otro archivo de la raíz (favicon, manifest):
    # sin caché larga -- es el único archivo sin hash en el nombre y debe
    # poder actualizarse en cada despliegue sin esperar a que expire una
    # caché de navegador/CDN.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ------------------------------------------------------------------
    # SPA: cualquier ruta que no sea un archivo real cae a index.html para
    # que react-router-dom resuelva la navegación en el cliente (evita 404
    # de nginx al refrescar una ruta profunda como /preparacion/expediente).
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nunca servir dotfiles (p. ej. un .env olvidado en el build, aunque no
    # debería existir en dist/ -- defensa en profundidad).
    location ~ /\. {
        deny all;
    }
}
