# nginx.conf principal para la imagen de apps/web — reemplaza por completo
# el que trae la imagen base `nginx:1.27-alpine` (en vez de parchearlo con
# `sed`, frágil e imposible de verificar en este entorno sin Docker real:
# el `sed` de Alpine es BusyBox sed, cuyo soporte de inserciones
# multilínea no es idéntico al GNU sed con el que se probaría en un Mac/
# Linux de desarrollo). Este archivo se escribe completo a propósito, para
# poder revisarlo línea por línea sin depender de qué trae la imagen base.
#
# Corre como usuario no-root (ver apps/web/Dockerfile: `USER nginx`, todo
# el proceso -- master incluido, no solo los workers) -- por eso:
#   - Sin directiva `user` (no tiene sentido si el master ya no es root;
#     nginx solo emitiría una advertencia inofensiva, se omite del todo).
#   - `pid` y todos los `*_temp_path` apuntan a /tmp (mundialmente
#     escribible en cualquier imagen base, no depende de la propiedad de
#     /var/run o /var/cache/nginx en la imagen base).
#   - Escucha en el puerto 8080 (ver infra/docker/nginx.web.conf) -- un
#     puerto <1024 como el 80 requiere privilegios de root para abrirse.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # La imagen base `nginx:*-alpine` ya enlaza estos dos archivos a
    # /dev/stdout y /dev/stderr respectivamente -- se preservan esas
    # mismas rutas para no perder esa integración con
    # `docker logs`/`docker compose logs` (ver Dockerfile de la imagen
    # oficial: no se recrean los symlinks aquí, ya vienen así).
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
